<!DOCTYPE html>
<html>
<head>
    <title>Form Data Diri</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f2f2f2; }
        form { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #4CAF50; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <form action="/submit" method="POST">
        <h2>Isi Data Diri</h2>
        <label>Nama:</label>
        <input type="text" name="nama" required>
        <label>Umur:</label>
        <input type="number" name="umur" required>
        <label>Tanggal Lahir:</label>
        <input type="date" name="tanggal_lahir" required>
        <label>Alamat:</label>
        <textarea name="alamat" rows="2" required></textarea>
        <label>No HP:</label>
        <input type="tel" name="no_hp" required>
        <label>Pesan Anda:</label>
        <textarea name="pesan" rows="3" required></textarea>
        <button type="submit">Kirim</button>
    </form>
</body>
</html>
